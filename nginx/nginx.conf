# 土豆聊天 Nginx 反向代理配置(见 docs/04-部署方案.md)
# 前端静态资源 + /api、/ws 转发后端;生产另需在 SECoder Ingress 层配置 TLS

upstream potato_backend {
    # 后端容器监听 80(与生产一致,见 deploy/Dockerfile.backend)
    server backend:80;
    # WebSocket 长连接:空闲超时放宽
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # 安全基线:限制请求体大小(后续支持图片消息再按需放开)
    client_max_body_size 1m;

    # ---------- 前端静态资源 ----------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA 路由:全部回退到 index.html
        try_files $uri $uri/ /index.html;
    }

    # ---------- REST API ----------
    location /api/ {
        proxy_pass http://potato_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- WebSocket ----------
    location /ws {
        proxy_pass http://potato_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;  # 心跳 30s,超时留足余量
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}