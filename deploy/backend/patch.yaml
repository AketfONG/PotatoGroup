# 补丁:后端 StatefulSet。
#
# 容器端口保持基础模板的 80 且名为 http —— Service 的 targetPort: http
# 依赖这个名字解析,因此**不要改端口名**。
# 本项目的后端镜像本身监听 80(见 deploy/backend/Dockerfile)。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: backend
spec:
  # 必须显式声明:自 K8s 1.31 起,StatefulSet 若使用 RollingUpdate 策略
  # (Kustomize 会补上该字段)但缺少 spec.ordinals,API 校验会直接拒绝。
  # 显式写上可避免这个升级陷阱;显式设置时无需 ordinals。
  updateStrategy:
    type: RollingUpdate
  template:
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: backend
          # 占位符:由 CI 的 deploy 作业替换为
          # ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHA}
          image: BACKEND_IMAGE
          # 配置与密钥全部走 ConfigMap / Secret,不落仓库
          envFrom:
            - configMapRef:
                name: potato-config
            - secretRef:
                name: potato-secret
          # 健康检查走统一响应包络接口,返回 code=0 即视为可服务
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            # 后端略低于前端(基础模板注释口径:后端 100Mi)
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: "1"
              memory: 2Gi
