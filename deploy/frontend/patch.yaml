# 补丁:前端 Deployment(基础资源里的容器名为 nginx)。
#
# 基础模板的容器端口已经是 80 且名为 http,Service/frontend 也指向该命名端口,
# 因此这里只需替换镜像 —— 端口保持不变。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: nginx
          # 占位符:由 CI 的 deploy 作业替换为
          # ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHA}
          image: FRONTEND_IMAGE
          resources:
            # g-* 命名空间配额:requests 256m CPU / 512Mi,limits 8 CPU / 16Gi
            # 前后端合计 requests 100m / 228Mi,留有余量
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
# 补丁:前端 Service 的 selector。
#
# ⚠️ 基础模板的 Service **完全没有 selector**,若只依赖 manifests/frontend/
#    kustomization.yaml 里的 labels 变换,pod 与 Service 的匹配依赖该变换是否
#    生效。这里显式再补一次,双保险:Kustomize 的实测结果是 labels 变换
#    在 Service 缺失 selector 时会补上,两处一致不冲突。
#    若这里与上面的标签不一致,Service 会选不到 Pod,页面直接打不开。
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/component: frontend
