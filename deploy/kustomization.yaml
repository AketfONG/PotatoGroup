# SECoder(Kubernetes)部署入口。
#
# 用法:CI 的 deploy 作业执行 `kubectl apply -k deploy --prune`
# 本地预览(不改集群):`kubectl kustomize deploy`
#
# ⚠️ 为什么基础清单是**内联**的(而不是像课程文档那样远程引用):
#   课程模板用 `git@github.com:THUSE-Course/secoder-tmpl.git/...`,
#   但 `alpine/k8s` 镜像里**没有 ssh**,报错 `cannot run ssh: No such file or directory`;
#   改成 https 形式又会被网络阻断(`Failed to connect to github.com:443`)。
#   因此把基础清单固化在 deploy/manifests/ 下,部署不再依赖外部网络。
#   来源:https://github.com/THUSE-Course/secoder-tmpl 的 deploy/basic/ 与 deploy/route/。
#
# 目录结构:
#   manifests/backend/   StatefulSet + Service(含 labels 变换补 Service selector)
#   manifests/frontend/  Deployment + Service(同上)
#   manifests/route/     HTTPRoute
#   backend/patch.yaml   覆盖后端镜像、envFrom、探针、资源
#   frontend/patch.yaml  覆盖前端镜像、资源
#   pvc.yaml             后端持久化
#   configmap.yaml       非敏感环境变量
resources:
  - manifests/backend
  - manifests/frontend
  - manifests/route
  - configmap.yaml

patches:
  # 覆盖后端镜像、环境变量与探针
  - path: backend/patch.yaml
  # 覆盖前端镜像与资源
  - path: frontend/patch.yaml
  # 后端持久化:挂载 PVC 到 /data(SQLite 数据不能放容器可写层)
  - path: pvc.yaml

# 密钥不落仓库:CI 的 deploy 作业用 ${JWT_SECRET} 生成该 Secret,
# 保证每次部署后 Secret 内容与 CI 变量一致(见 .gitlab-ci.yml 的 deploy 作业)。
secretGenerator:
  - name: potato-secret
    literals:
      - JWT_SECRET=CHANGE_ME_CI_WILL_OVERRIDE
    options:
      disableNameSuffixHash: true
