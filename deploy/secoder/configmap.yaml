# 非敏感配置;JWT_SECRET 与数据库密码放 Secret,严禁提交仓库(见 docs/04 安全清单)
apiVersion: v1
kind: ConfigMap
metadata:
  name: potato-config
data:
  DATABASE_URL: "mysql+pymysql://potato:CHANGE_ME@mysql:3306/potato?charset=utf8mb4"
  JWT_EXPIRE_DAYS: "7"
  CORS_ORIGINS: "https://potato.secoder.local"
  APP_ENV: "prod"
---
apiVersion: v1
kind: Secret
metadata:
  name: potato-secret
type: Opaque
stringData:
  # kubectl create secret ... 在 CI 中注入,此处仅为结构示例
  JWT_SECRET: "CHANGE_ME_TO_RANDOM_32_BYTES"