# SECoder Ingress:统一入口,生产必须启用 TLS(课程安全硬性要求:禁明文 HTTP)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: potato
  annotations:
    # 按集群实际 Ingress 控制器调整,例如:
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "300"   # WS 长连接
spec:
  tls:
    - hosts:
        - potato.secoder.local  # 替换为 SECoder 分配的域名
      secretName: potato-tls
  rules:
    - host: potato.secoder.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: potato-backend, port: { number: 8000 } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: potato-backend, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: potato-frontend, port: { number: 80 } } }