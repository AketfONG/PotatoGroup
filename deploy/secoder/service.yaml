apiVersion: v1
kind: Service
metadata:
  name: potato-backend
spec:
  selector: { app: potato-backend }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: potato-frontend
spec:
  selector: { app: potato-frontend }
  ports:
    - port: 80
      targetPort: 80