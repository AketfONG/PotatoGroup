# 补丁:HTTPRoute。
#
# 本目录名是 route,目录内资源会被命名为 route,而基础资源 metadata.name
# 也是 route —— 这里显式改名,配合 kustomization 里的 allowNameChange:true
# 避免命名冲突。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: potato-route
spec:
  # ⚠️ admission 策略强制:hostnames 里的每个值都必须以**本命名空间名**开头
  #    (见 secoder-tmpl/secoder/policy/validate-secoder-route.yaml)。
  #    组队项目部署在组命名空间 g-c(依据:GitLab 分组路径 g2026/g-c,
  #    小组标识符为 c,集群按 g-<标识符> 生成命名空间)。
  #    若实际命名空间不同,改为对应前缀;写错会被 admission 直接拒绝。
  hostnames:
    - g-c-potato-messanger.t.secoder.net

  rules:
    # ---------- 覆盖基础模板的 /api 规则 ----------
    # 基础模板原本对 /api 做 URLRewrite(ReplacePrefixMatch: /),会把
    # /api/v1/auth/login 变成 /v1/auth/login —— 后端 FastAPI 的路由前缀
    # 就是 /api/v1,去掉前缀会全部 404。这里**保留完整路径**,不做重写。
    - backendRefs:
        - name: frontend
          port: 80
          kind: Service
      matches:
        - path:
            type: PathPrefix
            value: /
    - backendRefs:
        - name: backend
          port: 80
          kind: Service
      matches:
        - path:
            type: PathPrefix
            value: /api
    # ---------- 新增 /ws 规则 ----------
    # 基础模板只覆盖 / 与 /api,/ws 会被 / 兜住转发到前端 nginx。
    # 后端 WebSocket 路由就注册在 /ws(见 backend/app/api/v1/ws.py),无需改写路径。
    - backendRefs:
        - name: backend
          port: 80
          kind: Service
      matches:
        - path:
            type: PathPrefix
            value: /ws
