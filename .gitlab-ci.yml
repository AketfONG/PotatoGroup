# 土豆聊天 CI：后端测试 + 前端类型检查/构建 + 镜像构建自检
# 说明：镜像推送与 SECoder 部署凭据由课程环境注入，不在仓库中保存。

stages:
  - test
  - build

default:
  interruptible: true

backend-test:
  stage: test
  image: python:3.11-slim
  variables:
    DATABASE_URL: "sqlite://"
    JWT_SECRET: "ci-test-secret-0123456789abcdef0123456789abcdef"
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements.txt -r backend/requirements-dev.txt
  script:
    - cd backend
    - pytest

frontend-check:
  stage: test
  image: node:20
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run typecheck
    - npm run build

docker-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -f deploy/Dockerfile.backend -t potato-backend:ci .
    - docker build -f deploy/Dockerfile.frontend -t potato-frontend:ci .
  rules:
    - if: $CI_COMMIT_BRANCH
