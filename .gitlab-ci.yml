# GitLab CI/CD 流水线:test → quality → build → deploy
#
# 课程要求(https://man.t.secoder.net/sonar.html)与《后端部署》手册:
#   后端单测覆盖率 >= 80%,由 SonarQube 质量门禁把关;
#   扫描失败必须阻断构建与部署。
#
# 重要:课程文档明确要求**不要把 CI 模板用远程 include: 引用**
# (Runner 访问外网不稳定),模板内容必须像本文件这样直接内联。

stages:
  - test
  - quality
  - build
  - deploy

# ============================================================
# 后端单测 + 覆盖率报告
# ============================================================
unit-test:
  stage: test
  # 与生产镜像 deploy/backend/Dockerfile 的 python:3.11-slim 保持一致。
  # 本地开发用的 3.13 不代表 CI 通过。
  image: python:3.11-slim
  variables:
    DATABASE_URL: sqlite:///./ci-test.db
    APP_ENV: test
    JWT_SECRET: ci-test-secret-0123456789abcdefghijklmnop
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - python -m pip install --quiet -r backend/requirements.txt
  script:
    # 从仓库根执行:覆盖率报告路径与 Sonar 扫描路径都依赖于此。
    - sh scripts/test.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage-reports/coverage.xml
      - xunit-reports/xunit-result.xml
    reports:
      junit: xunit-reports/xunit-result.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-reports/coverage.xml

# ============================================================
# 前端类型检查(不设覆盖率要求,课程只要求后端)
# ============================================================
frontend-typecheck:
  stage: test
  image: node:20-alpine
  before_script:
    - cd frontend
    # AGENTS.md 规则 6:有 lockfile,必须用 npm ci,不要用 npm install
    - npm ci
  script:
    - npx vue-tsc --noEmit

# ============================================================
# SonarQube 质量扫描 + 门禁
# ============================================================
sonarqube-check:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache-${CI_COMMIT_REF_SLUG}"
    paths:
      - .sonar/cache
  needs:
    - job: unit-test
      artifacts: true
  script:
    # 先确认报告真的产出了,避免"扫描通过但覆盖率是 0"这种静默失败
    - test -s coverage-reports/coverage.xml
    - test -s xunit-reports/xunit-result.xml
    - sonar-scanner
      -Dsonar.host.url="${SONAR_HOST_URL}"
      -Dsonar.qualitygate.wait=true
      -Dsonar.qualitygate.timeout=300
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ============================================================
# 镜像构建(BuildKit)
#
# 一个仓库构建两个镜像:通过覆盖模板变量实现
# (BUILDKIT_CONTEXT / BUILDKIT_DOCKERFILE_DIR / BUILDKIT_IMAGE_NAME)。
# 课程文档只给了单镜像示例,此处属变量扩展用法;若 Runner 上不生效,
# 备选方案是拆成前后端两个 GitLab 项目、各放一个根目录 Dockerfile。
# ============================================================
.buildkit:
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  stage: build
  variables:
    BUILDKITD_CONFIG: /tmp/buildkitd.toml
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox --config /tmp/buildkitd.toml
    BUILDKIT_FRONTEND: dockerfile.v0
    BUILDKIT_OUTPUT_TYPE: image
    BUILDKIT_PUSH: "true"
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
    - |
      cat > "$BUILDKITD_CONFIG" <<'EOF'
      [registry."docker.io"]
        insecure = true
      EOF
  script:
    - |
      set -eu
      # BuildKit 的 dockerfile.v0 前端只会读 <BUILDKIT_DOCKERFILE_DIR>/Dockerfile。
      # 提前校验,避免出错时报 "failed to read dockerfile: open Dockerfile" 这种
      # 看不出是哪个目录的隐晦错误。
      : "${BUILDKIT_DOCKERFILE_DIR:?BUILDKIT_DOCKERFILE_DIR is required}"
      if [ ! -f "${BUILDKIT_DOCKERFILE_DIR}/Dockerfile" ]; then
        echo "错误:找不到 ${BUILDKIT_DOCKERFILE_DIR}/Dockerfile"
        echo "BuildKit 只认该目录下名为 Dockerfile 的文件,请检查路径。"
        exit 1
      fi
      buildctl-daemonless.sh build \
        --frontend "${BUILDKIT_FRONTEND}" \
        --local context="${BUILDKIT_CONTEXT}" \
        --local dockerfile="${BUILDKIT_DOCKERFILE_DIR}" \
        --import-cache type=registry,ref="${BUILDKIT_CACHE_REF}" \
        --export-cache type=registry,ref="${BUILDKIT_CACHE_REF}",mode=max \
        --output type="${BUILDKIT_OUTPUT_TYPE}",name="${BUILDKIT_IMAGE_NAME}:${BUILDKIT_IMAGE_TAG}",push="${BUILDKIT_PUSH}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build-backend:
  extends: .buildkit
  variables:
    BUILDKIT_CONTEXT: .
    # BuildKit 的 dockerfile.v0 前端只会在该目录下找名为 Dockerfile 的文件,
    # 因此每个镜像各自放一个目录(目录里只有一个 Dockerfile)。
    BUILDKIT_DOCKERFILE_DIR: deploy/backend
    BUILDKIT_IMAGE_NAME: $CI_REGISTRY_IMAGE/backend
    BUILDKIT_IMAGE_TAG: $CI_COMMIT_SHA
    # 前后端分开缓存,避免互相覆盖
    BUILDKIT_CACHE_REF: $CI_REGISTRY_IMAGE/backend:buildcache

build-frontend:
  extends: .buildkit
  variables:
    BUILDKIT_CONTEXT: .
    BUILDKIT_DOCKERFILE_DIR: deploy/frontend
    BUILDKIT_IMAGE_NAME: $CI_REGISTRY_IMAGE/frontend
    BUILDKIT_IMAGE_TAG: $CI_COMMIT_SHA
    BUILDKIT_CACHE_REF: $CI_REGISTRY_IMAGE/frontend:buildcache

# ============================================================
# 部署(Kustomize + ApplySet)
# ============================================================
deploy:
  stage: deploy
  image:
    name: alpine/k8s:1.35.1
    entrypoint: [""]
  variables:
    KUSTOMIZE_PATH: deploy
  needs:
    # 显式依赖质量门禁与两个构建作业:任一失败都不部署
    - job: sonarqube-check
      artifacts: false
    - job: build-backend
      artifacts: false
    - job: build-frontend
      artifacts: false
  before_script:
    - |
      set -eu
      : "${TOKEN:?TOKEN is required}"
      : "${NAMESPACE:?NAMESPACE is required}"
      : "${JWT_SECRET:?JWT_SECRET is required}"
      : "${GITLAB_REGISTRY_USER:?GITLAB_REGISTRY_USER is required}"
      : "${GITLAB_DEPLOY_TOKEN:?GITLAB_DEPLOY_TOKEN is required}"
    # 私有 Registry 的拉取凭据:K8s 在 CI 作业结束后仍需拉取镜像
    - |
      kubectl --token="${TOKEN}" -n "${NAMESPACE}" \
        create secret docker-registry gitlab-registry \
        --docker-server="${CI_REGISTRY}" \
        --docker-username="${GITLAB_REGISTRY_USER}" \
        --docker-password="${GITLAB_DEPLOY_TOKEN}" \
        --dry-run=client -o yaml | \
        kubectl --token="${TOKEN}" -n "${NAMESPACE}" apply -f -
    # 把镜像占位符替换为本次提交构建出的镜像(与课程模板同做法)。
    # ⚠️ 路径随 deploy/ 目录结构调整过,改动目录结构时必须同步这四行。
    - |
      set -eu
      BACKEND_PATCH=deploy/backend/patch.yaml
      FRONTEND_PATCH=deploy/frontend/patch.yaml
      ROOT_KUST=deploy/kustomization.yaml
      for f in "$BACKEND_PATCH" "$FRONTEND_PATCH" "$ROOT_KUST"; do
        if [ ! -f "$f" ]; then
          echo "错误:找不到 $f —— 目录结构已变动,请同步 .gitlab-ci.yml 中 deploy 作业的路径"
          exit 1
        fi
      done
      sed -i "s|image: BACKEND_IMAGE|image: ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHA}|g" "$BACKEND_PATCH"
      sed -i "s|image: FRONTEND_IMAGE|image: ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHA}|g" "$FRONTEND_PATCH"
      # JWT_SECRET 不落仓库:每次部署用 CI 变量重写字面量
      sed -i "s|CHANGE_ME_CI_WILL_OVERRIDE|${JWT_SECRET}|g" "$ROOT_KUST"
      # 回显实际写入的镜像地址,便于在日志里核对
      grep -n 'image: ' "$BACKEND_PATCH" "$FRONTEND_PATCH"
  script:
    - |
      set -eu
      : "${KUBERNETES_SERVICE_HOST:?not running in k8s?}"
      : "${KUBERNETES_SERVICE_PORT:?not running in k8s?}"
      # 先渲染一遍,配置错误在 apply 之前就暴露
      kubectl kustomize "${KUSTOMIZE_PATH}" > /dev/null
      export KUBECTL_APPLYSET=true
      kubectl \
        --token="${TOKEN}" \
        -n "${NAMESPACE}" \
        apply -k "${KUSTOMIZE_PATH}" \
        --applyset="gitops-ci-${CI_PROJECT_PATH_SLUG:-unknown}" \
        --prune
      kubectl --token="${TOKEN}" -n "${NAMESPACE}" rollout status statefulset/backend --timeout=180s
      kubectl --token="${TOKEN}" -n "${NAMESPACE}" rollout status deployment/frontend --timeout=180s
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
