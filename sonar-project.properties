# SonarQube 扫描配置(课程要求:后端单测覆盖率 >= 80%)。
#
# 使用前需确认 sonar.projectKey:该值来自 SonarQube 导入本仓库后生成的 Project Key,
# 若与下方不一致,报告会被传到另一个(空的)项目里。
# 教程:https://man.t.secoder.net/sonar.html
#
# 认证不写在本文件:SONAR_HOST_URL 与 SONAR_TOKEN 由 GitLab CI/CD Variables 注入
# (SONAR_TOKEN 设为 Masked and hidden + Protected,并关闭变量展开)。

sonar.projectKey=u2026_u-2023012787_im-d_8289d8e2-5306-461d-90f7-14c51b92108a
sonar.qualitygate.wait=true
sonar.projectName=PotatoGroup
# ==============

# 目标运行时版本。取生产镜像的版本(deploy/Dockerfile.backend 的 python:3.11-slim),
# 而不是本地开发解释器(3.13),否则 SonarQube 会按错误的语法集合给出告警。
# 代码已验证不含 3.12+ 独有语法(如 PEP 695 泛型、type 语句),可在 3.11 运行。
sonar.python.version=3.11

# 分析范围:后端业务代码与测试。
# tests 同时列在 sources 中,是为了让 Sonar 的模块索引根与覆盖率报告路径对齐
# (报告中的文件名形如 backend/app/main.py,见 .coveragerc 的 source = .),
# 再由 test.inclusions 把它们标记为测试代码。
sonar.sources=backend/app,backend/tests
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.py

# 显式排除:缓存、虚拟环境、前端构建产物等都不参与后端分析。
# 与 .coveragerc 的 omit 保持一致。
sonar.exclusions=\
    **/__pycache__/**,\
    backend/.venv/**,\
    frontend/**,\
    node_modules/**,\
    nginx/**,\
    deploy/**,\
    scripts/**,\
    docs/**,\
    coverage-reports/**,\
    xunit-reports/**

# 覆盖率报告:Coverage.py 的 Cobertura XML,由 scripts/test.sh 生成。
sonar.python.coverage.reportPaths=coverage-reports/coverage.xml

# 测试执行报告:JUnit XML,由 scripts/test.sh 生成,让 Sonar 显示用例数与失败情况。
sonar.python.xunit.reportPath=xunit-reports/xunit-result.xml

# 重复代码检查范围:仅后端业务代码,避免把前端产物计入重复率。
sonar.cpd.exclusions=backend/tests/**,frontend/**,node_modules/**

# 质量门禁:由本文件的 sonar.qualitygate.wait 与 .gitlab-ci.yml 的扫描参数共同生效。
